name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: wasla
          POSTGRES_PASSWORD: wasla_ci
          # The e2e setup refuses any database whose name doesn't end in _test.
          POSTGRES_DB: wasla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasla -d wasla_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://wasla:wasla_ci@localhost:5432/wasla_test?schema=public

    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @wasla/shared build

      - name: Generate Prisma client
        run: pnpm --filter @wasla/api db:generate

      - name: Typecheck
        run: |
          pnpm --filter @wasla/shared typecheck
          pnpm --filter @wasla/api typecheck
          pnpm --filter @wasla/mobile typecheck

      - name: Shared unit tests
        run: pnpm --filter @wasla/shared test

      - name: API unit tests
        run: pnpm --filter @wasla/api test:unit

      - name: API end-to-end tests
        run: pnpm --filter @wasla/api test:e2e

      - name: API production build
        run: pnpm --filter @wasla/api build

  mobile-bundle:
    name: Android bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wasla/shared build
      - name: Export Android bundle
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir dist-ci
